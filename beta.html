<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AERA – Beta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07111f">

<link rel="apple-touch-icon" href="/img/aera-touch-icon.png">
<link rel="stylesheet" href="/aera.css?v=2">
<style>
.bt-hero{position:relative;padding:150px 0 40px;overflow:hidden}
.bt-hero .in{position:relative;z-index:2}.bt-hero .scope{top:-520px}
.bt-hero h1{margin:0;font:700 clamp(40px,6vw,68px)/1.04 var(--head);letter-spacing:-.03em}
.bt-hero .sub{max-width:640px}
.bt-body{padding-bottom:110px;min-height:40vh}
.bt-card{position:relative;max-width:820px;padding:30px 32px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px #0006}
.bt-card h2{margin:0 0 6px;font:700 30px/1.15 var(--head);letter-spacing:-.02em}
.bt-card p{color:var(--grey);margin:6px 0 0}
.bt-user{display:flex;align-items:center;gap:12px;margin-bottom:22px;color:var(--grey);font-size:14.5px}
.bt-user img{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2)}
.bt-user a{margin-left:auto;color:var(--muted);font-size:13.5px}
.bt-ver{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.bt-ver b{font:700 40px/1 var(--mono);color:#fff;letter-spacing:-.02em}
.bt-pill{padding:4px 11px;border-radius:999px;font:600 12.5px var(--mono);background:#3ddc971f;color:#3ddc97;border:1px solid #3ddc9744}
.bt-meta{font:500 13px var(--mono);color:var(--muted)}
.bt-files{display:flex;flex-direction:column;gap:10px;margin:24px 0 6px}
.bt-files .btn{justify-content:space-between;width:100%;max-width:520px}
.bt-files .btn small{font:500 12.5px var(--mono);opacity:.75}
.bt-notes{margin-top:22px;padding-top:6px;border-top:1px solid var(--line);font-size:14.5px;color:var(--grey)}
.bt-notes h3,.bt-notes h4,.bt-notes h5{color:#fff;margin:18px 0 6px;font:700 17px var(--head)}.bt-notes h3{font-size:20px}
.bt-notes p{margin:6px 0}.bt-notes ul{margin:6px 0;padding-left:20px}.bt-notes li{margin:3px 0}.bt-notes li.sub{margin-left:18px;list-style:circle}
.bt-notes hr{border:0;border-top:1px solid var(--line);margin:16px 0}.bt-notes code{font:12.5px var(--mono);background:#ffffff10;padding:1px 6px;border-radius:5px}.bt-notes a{color:var(--sky)}
.bt-older{margin-top:26px}.bt-older summary{cursor:pointer;color:var(--sky);font-weight:600}
.bt-older ul{list-style:none;padding:0;margin:12px 0 0}.bt-older li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--grey)}
.bt-older li a{margin-left:auto;color:var(--sky)}
.bt-discord{background:#5865F2!important;color:#fff!important;border-color:#5865F2!important}
.bt-discord:hover{box-shadow:0 10px 30px #5865f266}
.bt-err{margin-top:18px;padding:12px 16px;border-radius:12px;background:#ff5a6a14;border:1px solid #ff5a6a44;color:#ffb3bb;font-size:14.5px}
.bt-steps{margin:18px 0 0;padding-left:20px;color:var(--grey)}.bt-steps li{margin:4px 0}
</style>
</head>

    <div class="scope" aria-hidden="true"><div class="sweep"></div></div>

    <div class="in">
      <p class="eyebrow"><span class="slashes"></span>Beta</p>
      <h1 data-de="Beta-Tester-Bereich." data-en="Beta tester area.">Beta-Tester-Bereich.</h1>
      <p class="sub" data-de="Hier lädst du immer den neuesten AERA-Build. Anmeldung mit deinem Discord-Konto – Zugang hat, wer auf dem AERA-Server die Rolle Beta Tester hat." data-en="Always get the newest AERA build here. Sign in with your Discord account – everyone with the Beta Tester role on the AERA server has access.">Hier lädst du immer den neuesten AERA-Build.</p>

    <div class="bt-card" id="card"><p class="bt-meta">…</p></div>
  </section>
</main>

</body>
</html>
