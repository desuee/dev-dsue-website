<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mail – dev-dsue</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/admin/style.css?v=1">
<script src="/admin/app.js?v=1" defer></script>
</head>
<body>
<!-- sign in -->
<section id="login" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="/img/logo.png" alt="" class="login-logo">
    <h1>Postfach</h1>
    <p class="muted">Melde dich mit deiner E-Mail-Adresse und dem Passwort deines Postfachs an.</p>
    <label>E-Mail<input id="lUser" type="email" name="username" autocomplete="username" required></label>
    <label>Passwort<input id="lPass" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="lBtn">Anmelden</button>
    <p id="lErr" class="err"></p>
    <a href="/" class="back">← Zur Website</a>
  </form>
</section>

<!-- mail -->
<section id="app" class="app hidden">
  <header class="top">
    <button class="icon-btn menu" id="menuBtn" title="Ordner"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a href="/" class="brand"><img src="/img/logo.png" alt=""><span>Mail</span></a>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Suchen …"></div>
    <button class="btn primary compose-btn" id="composeBtn"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Neue E-Mail</span></button>
    <button class="theme" id="theme" title="Hell / Dunkel"><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="icon-btn" id="logoutBtn" title="Abmelden"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
  </header>
  <div class="panes" id="panes">
    <nav class="folders" id="folders"></nav>
    <section class="list">
      <div class="list-head"><b id="folderTitle">Posteingang</b><button class="icon-btn" id="refreshBtn" title="Aktualisieren"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
      <div id="items" class="items"></div>
      <div id="pager" class="pager"></div>
    </section>
    <section class="reader" id="reader">
      <div class="empty-reader"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><p>Wähle eine E-Mail aus</p></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
</section>

<!-- compose -->
<div class="modal hidden" id="compose">
  <form class="compose" id="composeForm">
    <header><b id="composeTitle">Neue E-Mail</b><button type="button" class="icon-btn" id="composeClose" title="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <label class="row"><span>An</span><input id="cTo" type="text" required placeholder="name@beispiel.de"></label>
    <label class="row"><span>Cc</span><input id="cCc" type="text"></label>
    <label class="row"><span>Betreff</span><input id="cSubject" type="text"></label>
    <textarea id="cText" placeholder="Deine Nachricht …"></textarea>
    <footer><span class="muted small" id="cFrom"></span><button class="btn primary" type="submit" id="cSend"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>Senden</button></footer>
  </form>
</div>
</body>
</html>
